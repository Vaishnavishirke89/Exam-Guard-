name: Deploy Exam Guard AI to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: .
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}/frontend
        run: |
          npm ci
          npm run build

      - name: Install backend production dependencies
        working-directory: ${{ env.APP_DIR }}/backend
        run: npm ci --omit=dev

      - name: Package app
        run: |
          mkdir -p deploy/frontend
          cp -r $APP_DIR/backend deploy/backend
          cp -r $APP_DIR/frontend/dist deploy/frontend/dist
          cd deploy && zip -qr ../release.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
